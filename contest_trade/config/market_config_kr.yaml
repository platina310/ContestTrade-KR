# KR (KOSPI) market configuration
# 개발·게이트 파일럿용. 본실험 유니버스는 point-in-time KOSPI200 (D13) 확정 후
# 구간별 custom_symbols 생성 스크립트로 대체한다 — 현재 목록은 개발용 테스트 유니버스.

target_markets:
  - "KR-Stock"

custom_symbols:
  KR-Stock:
    - "005930"   # 삼성전자
    - "000660"   # SK하이닉스
    - "005380"   # 현대차
    - "373220"   # LG에너지솔루션
    - "034020"   # 두산에너빌리티
    - "012450"   # 한화에어로스페이스
    - "009150"   # 삼성전기
    - "105560"   # KB금융
    - "000270"   # 기아
    - "006400"   # 삼성SDI
    - "032830"   # 삼성생명
    - "028260"   # 삼성물산
    - "055550"   # 신한지주
    - "068270"   # 셀트리온
    - "012330"   # 현대모비스
    - "005490"   # POSCO홀딩스
    - "006800"   # 미래에셋증권
    - "035420"   # NAVER
    - "009540"   # HD한국조선해양
    - "051910"   # LG화학
    - "096770"   # SK이노베이션
    - "066570"   # LG전자
    - "035720"   # 카카오
    - "000810"   # 삼성화재
    - "017670"   # SK텔레콤
    - "000720"   # 현대건설
    - "090430"   # 아모레퍼시픽
    - "000100"   # 유한양행
    - "034220"   # LG디스플레이
    - "251270"   # 넷마블

# 거래비용 — 잠정치 (팀 회의 9/21 확인 대상, 근거는 온라인 증권사 일반 조건)
trading_costs:
  KR-Stock:
    type: "kr_stock"
    commission_rate: 0.00015       # 위탁수수료 0.015% (양방향)
    transaction_tax_rate: 0.0020   # 매도 증권거래세 0.05%+농특세 0.15% (KOSPI 2026~)
    slippage_rate: 0.001           # 슬리피지 0.1%
    slippage_mode: "percentage"
    slippage_fixed: 10.0           # 고정 모드 시 10원
    min_shares: 1
